name: Secret-Scan

# Wöchentlicher Secret-Scan (#92) über die ganze Git-Historie mit gitleaks, danach die Secret-Inbox: ein Fund wird EIN Ticket
# "🔒 Security: Secret rotieren/widerrufen" ganz oben im Board; dazu hält der Lauf das Ticket "🔍 Security-Tabs prüfen" offen.
# Mechanik: docs/ticket-reihenfolge.md › Secret-Inbox.
#
# gitleaks läuft als CLI im Container, der per Digest gepinnt ist (v8.30.1, Digest der Multi-Arch-Index aus ghcr.io/gitleaks/gitleaks).
# Ein Digest-Update ist Handarbeit: Dependabot sieht `docker run` in einem Schritt nicht. Der Bericht ist redigiert (`--redact`), die
# Inbox liest nur Regel, Datei, Zeile, Commit, Fingerprint und gibt nie einen Wert aus. `--exit-code 0`: der Fund ist ein Ticket, kein roter Lauf.
# Bewusst keine Fremd-Action (gitleaks-action) und kein zweites Werkzeug. Ein Fehlalarm kommt mit Begründung in `.gitleaksignore`.
#
# ⚠️ Das Board braucht wie codescanning-inbox.yml das Secret PROJECT_TOKEN (PAT mit project-Scope); ohne Token nur eine Warnung.
# Grenze: GitHub-Secret-Scanning-Alerts sind mit dem Workflow-Token vermutlich nicht lesbar (403/404); dann meldet der Lauf eine
# GRENZE-Zeile und arbeitet mit gitleaks allein weiter (die Alerts liest der wöchentliche Prüf-Ticket-Lauf lokal).
# Alle Actions sind per Commit-SHA, das Image per Digest gepinnt (Wächter: test/harness/sicherheits-workflows.test.ts).

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

concurrency: secret-scan

permissions: {}

jobs:
  scan:
    name: Secret-Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # Die ganze Historie (fetch-depth: 0), sonst fände gitleaks nur den letzten Commit; zugleich die volle Import-Hülle für board-place.mjs.
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: gitleaks über die Historie
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact --report-format json --report-path /repo/gitleaks-bericht.json --exit-code 0

      - name: Funde einordnen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/secret-inbox.mjs --bericht gitleaks-bericht.json
