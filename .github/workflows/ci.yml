name: CI

# Qualitätstore bei jedem Push auf main und bei jedem Pull Request.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Veraltete Runs desselben Branches oder PRs abbrechen, sobald ein neuer startet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Tests, Typecheck & Builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle Historie, damit check:diffsize den PR-Slice gegen die PR-Basis messen kann.
          fetch-depth: 0
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: node scripts/gate-befehl.mjs install

      # Auf einem PR ist die Diff-Basis der erste Elternteil des Merge-Commits, auf main der Vorgänger-Commit.
      - name: Diff-Basis bestimmen
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git rev-parse HEAD^1)
          else
            base="$BEFORE_SHA"
          fi
          echo "FACTORY_DIFF_BASE=$base" >> "$GITHUB_ENV"

      # Alle Gates laufen über EINE Kette statt einzeln dupliziert: der Gate-Befehl verifyKompakt (Projekt-Config, Standard `npm run verify:kompakt`, Kette: package.json › scripts.verify), nicht hier
      # kopiert, damit die lokale Reihenfolge nicht von der CI driftet und kein Gate lokal vergessen wird. Anders als die &&-Kette läuft er alle Schritte
      # auch nach einem Rot und zeigt alle roten Blöcke auf einmal (in GitHub Actions ungekürzt, factory#401), ein Fix behebt so alle Funde in einer Runde. FACTORY_COVERAGE=1
      # (vite.config.ts › coverage.enabled) instrumentiert den Testschritt der Kette: eine Suite statt zweier (factory#270), die
      # Floors (thresholds) greifen am Ende dieses Schritts. Diff-Coverage ist der eigene Schritt dahinter (zusammen = `npm run verify:full`).
      - name: Verify, alle Gates in einer Kette
        env:
          FACTORY_COVERAGE: "1"
        run: node scripts/gate-befehl.mjs verifyKompakt

      # Misst nur die im Slice geänderten Zeilen (coverage/lcov.info aus dem Verify-Lauf davor, geschnitten mit dem Diff), darum NACH
      # dem Verify-Schritt; FACTORY_DIFF_BASE kommt aus „Diff-Basis bestimmen“ oben.
      - name: Diff-Coverage-Gate
        run: npm run check:diffcoverage

      - name: Review- und Plan-Nachweis prüfen
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: node scripts/check-review-nachweis.mjs

      # Abnahme-Nachweis: Urteil je Akzeptanzkriterium des verknüpften Tickets plus Spur als PR-Kommentar (Format: docs/agent-harness.md §3a).
      # Letzter Schritt, im Required-Job (kein neuer Required-Check). Ein Entwurf wird nur berichtet, maßgeblich ist der Lauf nach
      # `ready_for_review`. Werte aus dem Ereignis nur über `env:`, nie per Ausdruck im `run:` (Script-Injection). GH_TOKEN liest Issue und
      # Kommentare (Rechte `pull-requests` und `issues` read oben).
      - name: Abnahme-Nachweis prüfen
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PR_NUMBER: ${{ github.event.pull_request.number }}
          FACTORY_PR_DRAFT: ${{ github.event.pull_request.draft }}
          FACTORY_PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-abnahme-nachweis.mjs

  security-audit:
    name: Security-Audit (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit der Abhängigkeiten (Wurzel plus audit.verzeichnisse, blockt bei high und höher)
        run: node scripts/audit-verzeichnisse.mjs --audit-level high

  # Probe-Erstbezug (factory#234): baut im Runner-Temp einen Fixture-Bezieher (Fixture-Projekt, AGENTS.md mit Kern-Markern und Projekt-Block in Größe von PROJEKT_BLOCK_RAUM), synct ihn aus einem lokalen Klon
  # dieses Commits mit lokalem Tag, fährt die mechanischen Update-Schritte und das volle verifyKompakt. Jeder Fund ist rot (Kern-Budget, tote Kern-Verweise): die Fabrik findet sie selbst, auch ohne
  # bekannten Bezieher. Kein continue-on-error: sonst bliebe der Lauf grün und der Tag-Takt (ciZustand) sähe den Fund nicht. Required Check im Ruleset main-schutz (factory#263):
  # Rot sperrt den Merge und wirkt zusätzlich über den Blocker im Tag-Ticket und den Alarm auf main. Der Job schreibt nirgends (nur Lesen, nur ein lokaler Klon im Temp-Ordner). Grenze: ersetzt keinen echten Bezieher.
  # Entscheidung factory#270: kein Pfadfilter und kein Nur-main, weil der Job parallel in 27-38 s gegen 119-187 s von build-test läuft (Wandzeit-Ersparnis 0 s) und ein Filter auf einem Required Check eine kernrelevante Änderung übersehen könnte; Re-Evaluierung in docs/adr/fortschreibungen/0009-270-ci-ein-testlauf.md.
  probe-erstbezug:
    name: Probe-Erstbezug (Erstbezug mit verifyKompakt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: node scripts/gate-befehl.mjs install

      - name: Probe-Erstbezug
        run: node scripts/probe-erstbezug.mjs --quelle "$GITHUB_WORKSPACE" --scratch "$RUNNER_TEMP/probe-erstbezug"

  # Synthetische Bezieher je Profil ohne Stellvertreter (factory#224): dieselbe Kette wie der Probe-Erstbezug, mit der Profil-Fixture aus test/fixtures/probe-profil/<profil>.json (Java, Python: Config-Overlay,
  # Quelldateien, Node-Stellvertreter für Maven und pytest in der verify-Kette). Die Matrix ist die Liste der Profil-Dateien (Wächter in test/probe-profil.test.ts). Kein Required Check (das wäre eine Ruleset-Änderung):
  # ein Rot sperrt den Tag über den CI-Zustand des Commits (ciZustand liest den Abschluss von ci.yml) und alarmiert auf main. Kein continue-on-error, kein || true. Der Matrixwert geht nur über env in die Shell.
  probe-profil:
    name: Synthetischer Bezieher ${{ matrix.profil }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profil: [java, python]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: node scripts/gate-befehl.mjs install

      - name: Synthetischer Bezieher
        env:
          PROFIL: ${{ matrix.profil }}
        run: node scripts/probe-erstbezug.mjs --profil "$PROFIL" --quelle "$GITHUB_WORKSPACE" --scratch "$RUNNER_TEMP/probe-profil-$PROFIL"

  # Doku-Aktualitäts-Wächter: gleicht die in der Doku als „offen“ markierten Roadmap-Tickets gegen den echten gh-issue-Status ab und
  # ALARMIERT, wenn ein längst geschlossenes Ticket noch als offen dokumentiert ist. Bewusst nicht in der hermetischen `verify`-Kette:
  # der Abgleich braucht Netz und Token. continue-on-error: nicht blockierend, der rote Schritt bleibt als Alarm sichtbar. Kein `npm ci`
  # nötig (nur Node-Builtins und gh).
  doc-freshness:
    name: Doku-Aktualität (Roadmap-Tickets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # check-doc-tickets.mjs liest den Issue-Status per gh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Offen-markierte Roadmap-Tickets gegen gh-Status prüfen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-doc-tickets.mjs

  # Post-hoc-Netz auf main: ein roter `main` trotz grüner PR-Checks öffnet ein Alarm-Issue, nur auf push und ohne den Workflow zu blockieren. Die Mechanik
  # (Dedup, Board-Position, PROJECT_TOKEN) wohnt im Kern-Workflow alarm-rot-main.yml; das Label (ein existierendes Label des Projekts) kommt als Input. Ein Workflow mit eigenem Sammel-Job trägt denselben Aufruf (der Sammel-Job hängt per needs an allen anderen Jobs außer denen, die selbst an ihm hängen, läuft mit `!cancelled()` und wird rot bei einem roten oder abgebrochenen Bedarfsjob); der Doctor-Punkt "Sammel-Check" prüft das für die Workflows aus `sammelChecks` (hier nicht gesetzt: dieser Job hängt an vier Jobs).
  alarm-red-main:
    name: Alarm bei rotem main
    needs: [build-test, security-audit, probe-erstbezug, probe-profil]
    if: failure() && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/alarm-rot-main.yml
    with:
      label: area:harness
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
